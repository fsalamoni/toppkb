<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>
<line x1="50" y1="520" x2="350" y2="520" stroke="#475569" stroke-width="2"/>
<rect id="header-rect" x="0" y="0" width="400" height="110" fill="#a855f7"/>
<text x="40" y="40" font-size="22" font-weight="bold" fill="#0f172a" font-family="sans-serif">HALF SNATCH</text>
<text x="40" y="68" font-size="12" fill="#0f172a" opacity="0.8" font-family="sans-serif">kb-half-snatch</text>
<circle cx="350" cy="55" r="40" fill="#0f172a"/>
<text x="350" y="68" font-size="36" font-weight="bold" fill="#a855f7" text-anchor="middle" font-family="sans-serif">2</text>
<text x="40" y="155" font-size="20" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Hip Drive + Lockout</text>
<text x="40" y="180" font-size="11" fill="#94a3b8" font-family="sans-serif">Snap glúteo explosivo. KB vai ao lockout overhead. Pés podem saltar levemente.</text>

<circle cx="200" cy="200" r="20" fill="none" stroke="#cbd5e1" stroke-width="6"/>
<line x1="200" y1="220" x2="200" y2="370" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
<line x1="200" y1="240" x2="200" y2="100" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
<circle cx="200" cy="80" r="20" fill="#a855f7"/>
<rect x="188" y="65" width="24" height="32" fill="none" stroke="#581c87" stroke-width="2"/>
<line x1="200" y1="370" x2="180" y2="510" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
<line x1="200" y1="370" x2="220" y2="510" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
<!-- DELTÓIDE HIGHLIGHT -->
<ellipse cx="200" cy="225" rx="30" ry="25" fill="#a855f7" opacity="0.4"/>
<text x="245" y="220" font-size="11" fill="#a855f7" font-weight="bold" font-family="sans-serif">DELTÓIDE</text>
<text x="245" y="240" font-size="11" fill="#a855f7" font-weight="bold" font-family="sans-serif">TRAVA</text>
<!-- Lockout mark -->
<text x="200" y="55" font-size="13" fill="#10b981" font-weight="bold" text-anchor="middle" font-family="sans-serif">LOCKOUT!</text>
<line x1="280" y1="80" x2="280" y2="370" stroke="#10b981" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
<text x="285" y="220" font-size="10" fill="#10b981" font-family="sans-serif">BRAÇO</text>
<text x="285" y="234" font-size="10" fill="#10b981" font-family="sans-serif">VERTICAL</text>

<rect x="0" y="555" width="400" height="45" fill="#a855f7" opacity="0.15"/>
<text x="40" y="575" font-size="12" font-weight="bold" fill="#a855f7" font-family="sans-serif">▶ Onde/como sentir</text>
<text x="40" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">Detalhes completos no app</text>

<animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite" xlink:href="#header-rect"/>
</svg>