<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0f172a"/>
          <stop offset="1" stop-color="#1e293b"/>
        </linearGradient>
      </defs>
      <rect width="400" height="600" fill="url(#bg)"/>
      <!-- Piso -->
      <line x1="50" y1="520" x2="350" y2="520" stroke="#475569" stroke-width="2"/>
      <!-- Stick figure STANDING -->
      <!-- Cabeça -->
      <circle cx="200" cy="160" r="22" fill="none" stroke="#cbd5e1" stroke-width="6"/>
      <!-- Pescoço e Tronco -->
      <line x1="200" y1="182" x2="200" y2="340" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
      <!-- Braços (estendidos para baixo, segurando o KB) -->
      <line x1="200" y1="220" x2="170" y2="320" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
      <line x1="200" y1="220" x2="230" y2="320" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
      <!-- KB -->
      <circle cx="200" cy="350" r="20" fill="#94a3b8"/>
      <rect x="190" y="335" width="20" height="30" fill="none" stroke="#64748b" stroke-width="3"/>
      <!-- Quadril -->
      <line x1="200" y1="340" x2="200" y2="370" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
      <!-- Pernas -->
      <line x1="200" y1="370" x2="180" y2="510" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
      <line x1="200" y1="370" x2="220" y2="510" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
      <!-- Anotações -->
      <text x="200" y="50" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">SETUP INICIAL</text>
      <text x="200" y="80" font-size="16" fill="#94a3b8" text-anchor="middle">Swing 2H — Hardstyle</text>
      <!-- Setas indicando posição -->
      <line x1="50" y1="540" x2="50" y2="510" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="35" y="570" font-size="13" fill="#10b981">Pés firmes</text>
      <text x="35" y="585" font-size="11" fill="#94a3b8">calcanhares</text>
      <text x="270" y="440" font-size="12" fill="#10b981" text-anchor="start">Glúteo firme</text>
      <text x="270" y="455" font-size="11" fill="#94a3b8" text-anchor="start">+ lombar neutra</text>
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
        </marker>
      </defs>
    
<animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite" xlink:href="#header-rect"/>
</svg>