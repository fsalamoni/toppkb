<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>
<line x1="50" y1="520" x2="350" y2="520" stroke="#475569" stroke-width="2"/>
<defs>
  <marker id="ah-1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
  </marker>
</defs>
<rect id="header-rect" x="0" y="0" width="400" height="110" fill="#ec4899"/>
