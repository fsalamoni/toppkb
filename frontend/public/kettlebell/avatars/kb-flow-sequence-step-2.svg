<line x1="220" y1="320" x2="200" y2="380" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
<line x1="220" y1="320" x2="220" y2="380" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
<circle cx="215" cy="395" r="20" fill="#94a3b8" opacity="0.6"/>
