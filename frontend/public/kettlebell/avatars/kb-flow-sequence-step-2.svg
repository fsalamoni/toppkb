<text x="350" y="68" font-size="36" font-weight="bold" fill="#ec4899" text-anchor="middle" font-family="sans-serif">2</text>
<text x="40" y="155" font-size="20" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Swing</text>
<text x="40" y="180" font-size="11" fill="#94a3b8" font-family="sans-serif">Swing 2H. Lockout.</text>

<!-- Cabeça mais baixa (hinge) -->
<circle cx="200" cy="280" r="22" fill="none" stroke="#cbd5e1" stroke-width="6"/>
