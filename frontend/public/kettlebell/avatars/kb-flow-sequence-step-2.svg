<line x1="220" y1="430" x2="260" y2="450" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
<line x1="260" y1="450" x2="270" y2="510" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
<line x1="260" y1="450" x2="240" y2="510" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
