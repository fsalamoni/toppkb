<line x1="60" y1="440" x2="180" y2="440" stroke="#10b981" stroke-width="3" marker-end="url(#ah-1)"/>
<text x="55" y="455" font-size="11" fill="#10b981" font-weight="bold" text-anchor="end" font-family="sans-serif">HIPS BACK</text>
