<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#f59e0b"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">SOTS PRESS</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">sots-press-step-1</text>

<!-- Step number -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#f59e0b" text-anchor="middle" font-family="sans-serif">1</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Squat fundo com KB no rack</text>

<!-- Corpo -->
<g transform="translate(0, 50)">
<line x1="200" y1="130" x2="200" y2="530" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
<g id="squat">
  <!-- Cabeça -->
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 0,100; 0,100; 0,0"
    keyTimes="0;0.4;0.6;1"
    dur="4s" repeatCount="indefinite"/>
  <circle cx="200" cy="170" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Tronco -->
  <line x1="200" y1="192" x2="200" y2="380" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <circle cx="200" cy="380" r="8" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="200" cy="380" r="5.5" fill="#ef4444" opacity="0.7"/>

  <!-- Coxas (animadas: paralelas ao chão quando baixo) -->
  <line x1="200" y1="380" x2="250" y2="395" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round">
    <animate attributeName="x2" values="230;250;250;230" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="385;395;395;385" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="380" x2="150" y2="395" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round">
    <animate attributeName="x2" values="170;150;150;170" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="385;395;395;385" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Joelhos -->
  <circle cx="230" cy="385" r="6" fill="#0f172a" stroke="#ef4444" stroke-width="2.5">
    <animate attributeName="cx" values="230;250;250;230" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="385" r="6" fill="#0f172a" stroke="#ef4444" stroke-width="2.5">
    <animate attributeName="cx" values="170;150;150;170" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</g>
<text x="80" y="220" font-size="40" fill="#f59e0b" opacity="0.4" font-weight="bold">↓↑</text><line x1="170" y1="385" x2="170" y2="535" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><line x1="230" y1="385" x2="230" y2="535" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="170" cy="535" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="170" cy="535" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="230" cy="535" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="230" cy="535" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="150" y1="545" x2="250" y2="545" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#f59e0b" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#f59e0b" font-family="sans-serif">▶ Animação (4s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Movimento físico real • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#f59e0b"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 1</text>
</g>
</svg>