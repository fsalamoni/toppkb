<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#3b82f6"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">ARMOR BUILDING COMPLEX (DAN ..</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">armor-building-complex-step-3</text>

<!-- Step circle -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#3b82f6" text-anchor="middle" font-family="sans-serif">3</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Clean</text>

<!-- Corpo + animação -->
<g transform="translate(0, 50)">
<line x1="200" y1="140" x2="200" y2="530" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><circle cx="200" cy="180" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/><line x1="200" y1="202" x2="200" y2="365" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/><circle cx="200" cy="380" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="200" cy="380" r="5.5" fill="#fbbf24" opacity="0.7"/><line x1="198" y1="210" x2="165" y2="175" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="202" y1="210" x2="235" y2="175" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="165" y1="175" x2="150" y2="230" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="235" y1="175" x2="250" y2="230" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><circle cx="165" cy="175" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="165" cy="175" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="235" cy="175" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="235" cy="175" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="255" cy="255" r="15.299999999999999" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 244.8 242.25 Q 255 229.5 265.2 242.25" fill="none" stroke="#57534e" stroke-width="2.125"/><rect x="247.35" y="233.75" width="15.299999999999999" height="10.2" rx="3.4" fill="none" stroke="#57534e" stroke-width="1.275"/><line x1="175" y1="380" x2="170" y2="450" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><line x1="225" y1="380" x2="230" y2="450" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><circle cx="170" cy="450" r="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="170" cy="450" r="3.5" fill="#fbbf24" opacity="0.7"/><circle cx="230" cy="450" r="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="230" cy="450" r="3.5" fill="#fbbf24" opacity="0.7"/><line x1="170" y1="450" x2="170" y2="515" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><line x1="230" y1="450" x2="230" y2="515" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="170" cy="515" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="170" cy="515" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="230" cy="515" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="230" cy="515" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="150" y1="525" x2="250" y2="525" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/><rect x="272.9" y="171" width="34.2" height="15" rx="4" fill="#1e293b" opacity="0.95"/><text x="290" y="183" font-size="11" fill="#3b82f6" text-anchor="middle" font-family="sans-serif" font-weight="500">FLOW</text>
<!-- Indicador de movimento animado no canto inferior -->
<g opacity="0.7">
<text x="40" y="540" font-size="40" fill="#3b82f6" font-weight="bold" font-family="sans-serif">
{TEM ANIMAÇÃO}
<animate attributeName="opacity" values="0.9;0.4;0.9" dur="6s" repeatCount="indefinite"/>
</text>
</g>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#3b82f6" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#3b82f6" font-family="sans-serif">▶ Animação (6s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Pose inicial → final → inicial • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#3b82f6"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 3</text>
</g>

<!-- Seta animada (movimento ↕) -->
<g transform="translate(50, 480)">
<text font-size="30" fill="#3b82f6" font-weight="bold" font-family="sans-serif" opacity="0.7">↻
<animateTransform attributeName="transform" type="rotate" from="0 15 15" to="360 15 15" dur="6s" repeatCount="indefinite"/>
</text>
</g>
</svg>