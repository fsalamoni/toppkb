<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#10b981"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">ALTERNATING SWING</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">alternating-swing-step-4</text>

<!-- Step number -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#10b981" text-anchor="middle" font-family="sans-serif">4</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Descida controlada (agora com mão E</text>

<!-- Corpo -->
<g transform="translate(0, 50)">
<line x1="200" y1="150" x2="200" y2="530" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><circle cx="200" cy="200" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
<g id="trunk">
  <animateTransform attributeName="transform" type="rotate"
    values="0 200 222; -45 200 222; -90 200 222; -45 200 222; 0 200 222"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="4s" repeatCount="indefinite"/>
  <line x1="200" y1="222" x2="200" y2="400" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <line x1="200" y1="260" x2="200" y2="320" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <line x1="200" y1="260" x2="220" y2="320" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
</g>

<g>
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 0,-30; 0,-50; 0,-30; 0,0"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="4s" repeatCount="indefinite"/>
  <circle cx="200" cy="400" r="8" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="200" cy="400" r="5.5" fill="#ef4444" opacity="0.7"/>
</g>

<g>
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 30,-30; 50,-100; 30,-30; 0,0"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="4s" repeatCount="indefinite"/>
  <circle cx="250" cy="420" r="15.299999999999999" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 239.8 407.25 Q 250 394.5 260.2 407.25" fill="none" stroke="#57534e" stroke-width="2.125"/><rect x="242.35" y="398.75" width="15.299999999999999" height="10.2" rx="3.4" fill="none" stroke="#57534e" stroke-width="1.275"/>
</g>
<text x="320" y="250" font-size="40" fill="#10b981" opacity="0.4" font-weight="bold">↻</text>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#10b981" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#10b981" font-family="sans-serif">▶ Animação (4s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Movimento físico real • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#10b981"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 4</text>
</g>
</svg>