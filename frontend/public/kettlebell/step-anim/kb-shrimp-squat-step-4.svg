<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#ef4444"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">SHRIMP SQUAT</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">shrimp-squat-step-4</text>

<!-- Step circle -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#ef4444" text-anchor="middle" font-family="sans-serif">4</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Completar Reps ANTES de Trocar</text>

<!-- Corpo + animação -->
<g transform="translate(0, 50)">
<line x1="30" y1="370" x2="370" y2="370" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><circle cx="80" cy="320" r="20" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/><line x1="100" y1="320" x2="280" y2="320" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/><circle cx="180" cy="320" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="180" cy="320" r="5.5" fill="#fbbf24" opacity="0.7"/><line x1="135" y1="320" x2="135" y2="370" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="135" cy="320" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="135" cy="320" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="135" y1="370" x2="100" y2="370" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="135" cy="370" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="135" cy="370" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="225" y1="320" x2="225" y2="370" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="225" cy="320" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="225" cy="320" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="225" y1="370" x2="260" y2="370" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="225" cy="370" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="225" cy="370" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="260" cy="405" r="15.299999999999999" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 249.8 392.25 Q 260 379.5 270.2 392.25" fill="none" stroke="#57534e" stroke-width="2.125"/><rect x="252.35" y="383.75" width="15.299999999999999" height="10.2" rx="3.4" fill="none" stroke="#57534e" stroke-width="1.275"/><line x1="255" y1="320" x2="350" y2="320" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><line x1="350" y1="320" x2="360" y2="350" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="350" cy="320" r="6" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="350" cy="320" r="3.5" fill="#fbbf24" opacity="0.7"/><line x1="60" y1="370" x2="360" y2="370" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/><line x1="100" y1="320" x2="350" y2="320" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><rect x="107.27499999999999" y="286" width="185.45000000000002" height="15" rx="4" fill="#1e293b" opacity="0.95"/><text x="200" y="298" font-size="11" fill="#ef4444" text-anchor="middle" font-family="sans-serif" font-weight="500">PRANCHA — corpo em linha reta</text>
<!-- Indicador de movimento animado no canto inferior -->
<g opacity="0.7">
<text x="40" y="540" font-size="40" fill="#ef4444" font-weight="bold" font-family="sans-serif">
{TEM ANIMAÇÃO}
<animate attributeName="opacity" values="0.9;0.4;0.9" dur="6s" repeatCount="indefinite"/>
</text>
</g>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#ef4444" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#ef4444" font-family="sans-serif">▶ Animação (6s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Pose inicial → final → inicial • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#ef4444"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 4</text>
</g>

<!-- Seta animada (movimento ↕) -->
<g transform="translate(50, 480)">
<text font-size="30" fill="#ef4444" font-weight="bold" font-family="sans-serif" opacity="0.7">↻
<animateTransform attributeName="transform" type="rotate" from="0 15 15" to="360 15 15" dur="6s" repeatCount="indefinite"/>
</text>
</g>
</svg>