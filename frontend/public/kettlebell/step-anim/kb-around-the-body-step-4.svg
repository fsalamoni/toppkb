<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#ef4444"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">AROUND THE BODY PASS (2 KB)</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">around-the-body-step-4</text>

<!-- Step number -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#ef4444" text-anchor="middle" font-family="sans-serif">4</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Sentido Inverso + Repetir</text>

<!-- Corpo -->
<g transform="translate(0, 50)">
<line x1="200" y1="130" x2="200" y2="530" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
<g>
  <animateTransform attributeName="transform" type="scale"
    values="1;1.1;1;1.1;1"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="3s" repeatCount="indefinite"
    additive="sum"/>
  <circle cx="200" cy="200" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="200" y1="222" x2="200" y2="380" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <circle cx="200" cy="380" r="8" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="198" y1="230" x2="175" y2="290" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="202" y1="230" x2="225" y2="290" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="175" y1="290" x2="175" y2="350" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="225" y1="290" x2="225" y2="350" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="175" y1="380" x2="170" y2="450" stroke="#cbd5e1" stroke-width="10"/>
  <line x1="225" y1="380" x2="230" y2="450" stroke="#cbd5e1" stroke-width="10"/>
  <line x1="170" y1="450" x2="170" y2="535" stroke="#cbd5e1" stroke-width="9"/>
  <line x1="230" y1="450" x2="230" y2="535" stroke="#cbd5e1" stroke-width="9"/>
</g>
<line x1="150" y1="545" x2="250" y2="545" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/><text x="320" y="280" font-size="50" fill="#ef4444" opacity="0.4" font-weight="bold">♥</text>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#ef4444" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#ef4444" font-family="sans-serif">▶ Animação (3s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Movimento físico real • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#ef4444"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 4</text>
</g>
</svg>