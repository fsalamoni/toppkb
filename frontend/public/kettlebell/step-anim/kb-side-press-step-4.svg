<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#ec4899"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">SIDE PRESS</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">side-press-step-4</text>

<!-- Step number -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#ec4899" text-anchor="middle" font-family="sans-serif">4</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#ec4899" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Lockout + Descer Inverso + Trocar L</text>

<!-- Corpo -->
<g transform="translate(0, 50)">

<g id="tgu">
  <!-- TGU progressão: deitado → sentado → joelho → em pé -->
  <animateTransform attributeName="transform" type="rotate"
    values="0 200 280; -45 200 280; -90 200 280; -90 200 280; 0 200 280"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="4s" repeatCount="indefinite"/>
  <line x1="60" y1="350" x2="340" y2="350" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <circle cx="80" cy="350" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="340" y1="350" x2="340" y2="180" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="340" cy="130" r="17.099999999999998" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 328.6 115.75 Q 340 101.5 351.4 115.75" fill="none" stroke="#57534e" stroke-width="2.375"/><rect x="331.45" y="106.25" width="17.099999999999998" height="11.399999999999999" rx="3.8" fill="none" stroke="#57534e" stroke-width="1.4249999999999998"/><circle cx="334.3" cy="124.3" r="2.8499999999999996" fill="#fbbf24" opacity="0.6"/>
</g>
<line x1="30" y1="380" x2="370" y2="380" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><text x="320" y="450" font-size="40" fill="#ec4899" opacity="0.4" font-weight="bold">↻</text>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#ec4899" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#ec4899" font-family="sans-serif">▶ Animação (4s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Movimento físico real • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#ec4899"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 4</text>
</g>
</svg>