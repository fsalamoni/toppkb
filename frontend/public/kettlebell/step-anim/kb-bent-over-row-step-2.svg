<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#06b6d4"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">BENT-OVER ROW</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">bent-over-row-step-2</text>

<!-- Step number -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#06b6d4" text-anchor="middle" font-family="sans-serif">2</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#06b6d4" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Puxar KB</text>

<!-- Corpo -->
<g transform="translate(0, 50)">
<line x1="200" y1="130" x2="200" y2="530" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><circle cx="200" cy="170" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/><line x1="200" y1="192" x2="190" y2="380" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/><circle cx="190" cy="380" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="190" cy="380" r="5.5" fill="#fbbf24" opacity="0.7"/>
<g>
  <animateTransform attributeName="transform" type="translate"
    values="0,0; -40,-50; -40,-50; 0,0"
    keyTimes="0;0.25;0.75;1"
    dur="4s" repeatCount="indefinite"/>
  <line x1="200" y1="220" x2="170" y2="300" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="170" y1="300" x2="170" y2="370" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="170" cy="300" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/>
  <circle cx="170" cy="400" r="15.299999999999999" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 159.8 387.25 Q 170 374.5 180.2 387.25" fill="none" stroke="#57534e" stroke-width="2.125"/><rect x="162.35" y="378.75" width="15.299999999999999" height="10.2" rx="3.4" fill="none" stroke="#57534e" stroke-width="1.275"/>
</g>
<line x1="202" y1="200" x2="225" y2="260" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="225" y1="260" x2="225" y2="320" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><circle cx="225" cy="260" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="225" cy="260" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="175" y1="380" x2="170" y2="450" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><line x1="225" y1="380" x2="230" y2="450" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><line x1="170" y1="450" x2="170" y2="535" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><line x1="230" y1="450" x2="230" y2="535" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="170" cy="535" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="170" cy="535" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="230" cy="535" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="230" cy="535" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="150" y1="545" x2="250" y2="545" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/><text x="80" y="280" font-size="50" fill="#06b6d4" opacity="0.4" font-weight="bold">←←</text>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#06b6d4" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#06b6d4" font-family="sans-serif">▶ Animação (4s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Movimento físico real • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#06b6d4"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 2</text>
</g>
</svg>