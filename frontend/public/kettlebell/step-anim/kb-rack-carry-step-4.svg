<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#f97316"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">RACK CARRY</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">rack-carry-step-4</text>

<!-- Step number -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#f97316" text-anchor="middle" font-family="sans-serif">4</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Distância Programada + Trocar Lado</text>

<!-- Corpo -->
<g transform="translate(0, 50)">

<g>
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 200,0; 200,0; 0,0"
    keyTimes="0;0.45;0.55;1"
    dur="4s" repeatCount="indefinite"/>
  <circle cx="100" cy="170" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="100" y1="192" x2="100" y2="380" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <circle cx="100" cy="380" r="8" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Braço com KB -->
  <line x1="98" y1="200" x2="70" y2="250" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="70" y1="250" x2="70" y2="320" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="70" cy="350" r="18.0" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 58.0 335.0 Q 70 320.0 82.0 335.0" fill="none" stroke="#57534e" stroke-width="2.5"/><rect x="61.0" y="325.0" width="18.0" height="12.0" rx="4.0" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <!-- Pernas -->
  <line x1="75" y1="380" x2="70" y2="450" stroke="#cbd5e1" stroke-width="10"/>
  <line x1="125" y1="380" x2="130" y2="450" stroke="#cbd5e1" stroke-width="10"/>
  <line x1="70" y1="450" x2="70" y2="535" stroke="#cbd5e1" stroke-width="9"/>
  <line x1="130" y1="450" x2="130" y2="535" stroke="#cbd5e1" stroke-width="9"/>
</g>
<text x="200" y="300" font-size="60" fill="#f97316" opacity="0.3" font-weight="bold" text-anchor="middle">→ → →</text><line x1="50" y1="545" x2="350" y2="545" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#f97316" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#f97316" font-family="sans-serif">▶ Animação (4s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Movimento físico real • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#f97316"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 4</text>
</g>
</svg>