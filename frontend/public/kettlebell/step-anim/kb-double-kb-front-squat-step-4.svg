<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
<rect width="400" height="600" fill="#0f172a"/>

<!-- Header -->
<rect x="0" y="0" width="400" height="60" fill="#f59e0b"/>
<text x="20" y="25" font-size="14" font-weight="bold" fill="#0f172a" font-family="sans-serif">DOUBLE KB FRONT SQUAT</text>
<text x="20" y="48" font-size="10" fill="#0f172a" opacity="0.7" font-family="sans-serif">double-front-squat-step-4</text>

<!-- Step circle -->
<circle cx="370" cy="30" r="22" fill="#0f172a"/>
<text x="370" y="37" font-size="22" font-weight="bold" fill="#f59e0b" text-anchor="middle" font-family="sans-serif">4</text>

<!-- Vista + título -->
<rect x="20" y="80" width="80" height="20" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="60" y="94" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle" font-family="sans-serif">VISTA FRONTAL</text>
<text x="115" y="95" font-size="14" font-weight="bold" fill="#cbd5e1" font-family="sans-serif">Empurrar com QUADRIL + Pernas (Lock</text>

<!-- Corpo + animação -->
<g transform="translate(0, 50)">
<line x1="200" y1="230" x2="200" y2="530" stroke="#475569" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/><text x="80" y="200" font-size="40" fill="#f59e0b" opacity="0.4" font-weight="bold">↓</text><circle cx="200" cy="270" r="22" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/><line x1="200" y1="292" x2="208" y2="400" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/><circle cx="208" cy="410" r="8" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/><circle cx="208" cy="410" r="5.5" fill="#ef4444" opacity="0.7"/><line x1="202" y1="300" x2="225" y2="320" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="208" y1="300" x2="230" y2="320" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="225" y1="320" x2="225" y2="350" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><line x1="230" y1="320" x2="230" y2="350" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><circle cx="225" cy="350" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="225" cy="350" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="230" cy="350" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="230" cy="350" r="2.5" fill="#fbbf24" opacity="0.7"/><circle cx="208" cy="365" r="15.299999999999999" fill="#a8a29e" stroke="#1c1917" stroke-width="1.5"/><path d="M 197.8 352.25 Q 208 339.5 218.2 352.25" fill="none" stroke="#57534e" stroke-width="2.125"/><rect x="200.35" y="343.75" width="15.299999999999999" height="10.2" rx="3.4" fill="none" stroke="#57534e" stroke-width="1.275"/><line x1="208" y1="410" x2="250" y2="395" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><circle cx="250" cy="395" r="6" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/><circle cx="250" cy="395" r="3.5" fill="#ef4444" opacity="0.7"/><line x1="250" y1="395" x2="250" y2="500" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="250" cy="500" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="250" cy="500" r="2.5" fill="#fbbf24" opacity="0.7"/><line x1="208" y1="410" x2="150" y2="395" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><circle cx="150" cy="395" r="6" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/><circle cx="150" cy="395" r="3.5" fill="#ef4444" opacity="0.7"/><line x1="150" y1="395" x2="150" y2="500" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/><circle cx="150" cy="500" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><circle cx="150" cy="500" r="2.5" fill="#fbbf24" opacity="0.7"/><path d="M 272.0 395.0 A 22 22 0 0 1 250.0 417.0" fill="none" stroke="#10b981" stroke-width="2"/><rect x="234.275" y="369" width="31.450000000000003" height="17" rx="4" fill="#1e293b" opacity="0.95"/><text x="250" y="383" font-size="13" fill="#34d399" text-anchor="middle" font-family="sans-serif" font-weight="500">90°</text><line x1="150" y1="505" x2="250" y2="505" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/><rect x="264.875" y="261" width="40.25" height="15" rx="4" fill="#1e293b" opacity="0.95"/><text x="285" y="273" font-size="11" fill="#f59e0b" text-anchor="middle" font-family="sans-serif" font-weight="500">FUNDO</text>
<!-- Indicador de movimento animado no canto inferior -->
<g opacity="0.7">
<text x="40" y="540" font-size="40" fill="#f59e0b" font-weight="bold" font-family="sans-serif">
{TEM ANIMAÇÃO}
<animate attributeName="opacity" values="0.9;0.4;0.9" dur="6s" repeatCount="indefinite"/>
</text>
</g>
</g>

<!-- Footer -->
<rect x="0" y="560" width="400" height="40" fill="#f59e0b" opacity="0.15"/>
<text x="20" y="578" font-size="11" font-weight="bold" fill="#f59e0b" font-family="sans-serif">▶ Animação (6s loop)</text>
<text x="20" y="592" font-size="10" fill="#94a3b8" font-family="sans-serif">• Pose inicial → final → inicial • Loop contínuo</text>

<!-- Tag PASSO N -->
<g transform="translate(330, 80)">
<rect x="0" y="0" width="50" height="22" rx="11" fill="#f59e0b"/>
<text x="25" y="15" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="sans-serif">PASSO 4</text>
</g>

<!-- Seta animada (movimento ↕) -->
<g transform="translate(50, 480)">
<text font-size="30" fill="#f59e0b" font-weight="bold" font-family="sans-serif" opacity="0.7">↻
<animateTransform attributeName="transform" type="rotate" from="0 15 15" to="360 15 15" dur="6s" repeatCount="indefinite"/>
</text>
</g>
</svg>