<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<h1>TopPKB Query Test</h1>
<pre id="out">Loading...</pre>
<script type="module">
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n[' + new Date().toISOString().substring(11,19) + '] ' + m; };
out.textContent = '';

try {
  const m = await import('/assets/firebase-vendor-BdzqWnxi.js');
  log('firebase-vendor loaded, keys=' + Object.keys(m).length);
  
  const getAuth = m.getAuth || m.q || m.G;
  const getFirestore = m.getFirestore || m.b || m.X;
  const collection = m.collection || m.A;
  const getDocs = m.getDocs || m.j;
  
  log('Auth: ' + typeof getAuth);
  log('Firestore: ' + typeof getFirestore);
  
  const auth = getAuth();
  const db = getFirestore();
  log('Auth user: ' + (auth.currentUser?.uid || 'null'));
  
  // Esperar auth state
  await new Promise(r => setTimeout(r, 2000));
  log('Auth user after 2s: ' + (auth.currentUser?.uid || 'null'));
  
  // Tentar query
  const uid = auth.currentUser?.uid || 'test';
  log('Querying treinos for ' + uid);
  const start = Date.now();
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT 8s')), 8000));
  const query = getDocs(collection(db, 'toppkb_users', uid, 'treinos'));
  const result = await Promise.race([query, timeout]);
  log('Query OK in ' + (Date.now() - start) + 'ms. docs=' + result.size);
} catch (e) {
  log('ERROR: ' + e.message + '\n' + (e.stack || ''));
}
</script>
</body>
</html>
