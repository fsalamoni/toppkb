<!DOCTYPE html>
<html>
<head><title>Test Dashboard Exact</title></head>
<body>
<h1>Dashboard Exact Test</h1>
<pre id="out">Loading...</pre>
<script type="module">
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n[' + new Date().toISOString().substring(11,19) + '] ' + m; };
out.textContent = '';

try {
  log('Loading firebase-vendor...');
  const m = await import('/assets/firebase-vendor-BdzqWnxi.js');
  
  // Simular o safeGet do Dashboard
  const safeGet = async (uid, col) => {
    log(`  safeGet(${col}) start`);
    try {
      const { getDocs, collection: c } = m;  // import direto, sem dynamic import
      const { db } = await import('/assets/index-dIWp8RB-.js').then(w => w.w);
      log(`  safeGet(${col}) got db=${typeof db}`);
      return await Promise.race([
        getDocs(c(db, 'toppkb_users', uid, col)).then(snap => {
          log(`  safeGet(${col}) resolved: ${snap.size} docs`);
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error(`Timeout ${col}`)), 6000)),
      ]);
    } catch (e) {
      log(`  safeGet(${col}) FAILED: ${e.message}`);
      return [];
    }
  };
  
  log('Doing Firebase Auth sign-in...');
  const { getAuth, signInWithCustomToken } = m;
  const auth = getAuth();
  const ID_TOKEN = 'TEST';
  
  // Get a real ID token
  const resp = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyDBEhTPDGhUwrvooOf4-wrM5lBtDMMtdSg', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: 'test-' + Date.now() + '@toppkb.app', password: 'teste123456', returnSecureToken: true}),
  });
  const userData = await resp.json();
  log('Created user: ' + userData.localId);
  
  // Inject auth state
  const db = (await import('/assets/index-dIWp8RB-.js')).db;
  // Use signInWithCustomToken
  const cred = await signInWithCustomToken(auth, userData.idToken).catch(e => {
    log('signInWithCustomToken failed: ' + e.message);
    return null;
  });
  log('Signed in: ' + (auth.currentUser?.uid || 'null'));
  
  if (auth.currentUser) {
    const uid = auth.currentUser.uid;
    log('Calling 7 parallel safeGet...');
    const start = Date.now();
    const result = await Promise.all([
      safeGet(uid, 'treinos'),
      safeGet(uid, 'partidas'),
      safeGet(uid, 'dores'),
      safeGet(uid, 'peso'),
      safeGet(uid, 'sono'),
      safeGet(uid, 'torneios'),
      safeGet(uid, 'hidratacao'),
    ]);
    log(`All 7 safeGet done in ${Date.now() - start}ms. Results: ${result.map(r => r.length).join(',')}`);
  }
} catch (e) {
  log('ERROR: ' + e.message);
  log('STACK: ' + (e.stack || ''));
}
</script>
</body>
</html>
