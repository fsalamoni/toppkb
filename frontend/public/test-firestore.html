<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<h1>TopPKB Query Test</h1>
<pre id="out">Loading...</pre>
<script type="module">
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n[' + new Date().toISOString().substring(11,19) + '] ' + m; };
out.textContent = '';

try {
  const m = await import('/assets/firebase-vendor-BdzqWnxi.js');
  log('firebase-vendor loaded, keys=' + Object.keys(m).length);
  
  const allKeys = Object.keys(m).filter(k => k.length <= 3);
  log('minified keys: ' + allKeys.join(','));
  
  // Tentar várias
  const getAuth = m.getAuth || m.q || m.G || m.B;
  const getFirestore = m.getFirestore || m.X || m.R;
  const collection = m.collection || m.A || m.Y;
  const getDocs = m.getDocs || m.j || m.P;
  
  log('getAuth: ' + typeof getAuth);
  log('getFirestore: ' + typeof getFirestore);
  log('collection: ' + typeof collection);
  log('getDocs: ' + typeof getDocs);
  
  if (!getAuth || !getFirestore) {
    log('FATAL: missing required exports');
  } else {
    const auth = getAuth();
    const db = getFirestore();
    log('Auth currentUser: ' + (auth.currentUser?.uid || 'null'));
    
    await new Promise(r => setTimeout(r, 2000));
    const uid = auth.currentUser?.uid;
    log('User after 2s: ' + uid);
    
    if (uid) {
      log('Querying treinos for ' + uid);
      const start = Date.now();
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT 8s')), 8000));
      const q = getDocs(collection(db, 'toppkb_users', uid, 'treinos'));
      const result = await Promise.race([q, timeout]);
      log('Query OK in ' + (Date.now() - start) + 'ms. docs=' + result.size);
    }
  }
} catch (e) {
  log('ERROR: ' + e.message);
}
</script>
</body>
</html>
