name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install functions deps
        working-directory: ./functions
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}

      - name: Build functions
        working-directory: ./functions
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Discover Firebase project ID
        run: |
          # Concatena o projectId com prefixo que evita masking
          gcloud config get-value project 2>&1 | sed 's/^/PID:/'
          gcloud projects list --format="value(projectId)" 2>&1 | sed 's/^/PROJ:/'

      - name: Deploy rules + indexes + functions
        working-directory: ./
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,functions \
            --project antonov \
            --force \
            --non-interactive

      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: antonov
          channelId: live
          target: hosting

      - name: Smoke test
        run: |
          sleep 30
          echo "Testando site..."
          curl -fsS https://toppkb.web.app > /dev/null && echo "✅ Site respondendo" || (echo "❌ Site não respondeu" && exit 1)
          curl -fsS https://toppkb.web.app/login > /dev/null && echo "✅ Login page OK" || (echo "❌ Login page falhou" && exit 1)
