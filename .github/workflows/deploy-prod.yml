name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Install functions deps
        working-directory: ./functions
        run: npm ci || npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}

      - name: Build functions
        working-directory: ./functions
        run: npm run build

      - name: Cache Firebase CLI
        uses: actions/cache@v4
        with:
          path: ~/.firebase
          key: ${{ runner.os }}-firebase

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy rules + indexes + storage + functions + hosting
        working-directory: ./
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions,hosting \
            --project antonov \
            --force \
            --non-interactive

      - name: Smoke test
        run: |
          sleep 20
          echo "Testando site..."
          curl -fsS https://toppkb.web.app > /dev/null && echo "✅ Site respondendo" || (echo "❌ Site não respondeu" && exit 1)
          curl -fsS https://toppkb.web.app/login > /dev/null && echo "✅ Login page OK" || (echo "❌ Login page falhou" && exit 1)
