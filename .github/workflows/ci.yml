name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Test
        working-directory: ./frontend
        run: npm test -- --run
      - name: Build
        working-directory: ./frontend
        run: npm run build

  test-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Lint
        working-directory: ./functions
        run: npm run lint
      - name: Typecheck
        working-directory: ./functions
        run: npm run typecheck
      - name: Test
        working-directory: ./functions
        run: npm test -- --run
      - name: Build
        working-directory: ./functions
        run: npm run build
